        <h1 class="heading-display" style="font-size: clamp(1.75rem,4vw,3rem); margin-bottom: 1rem">Gravier décoratif jardin — comment choisir ?</h1>
        <p style="color: var(--r-pierre); font-size: 0.9375rem">Par l'équipe Rustica Pierre · Aveyron</p>
      </div>

    <div class="article-body">
      <p style="font-size:1.0625rem;line-height:1.85">Le <strong>gravier decoratif</strong> est l'un des materiaux les plus polyvalents pour amenager un jardin. Allees, massifs, contours de piscine, cours interieures — il habille les espaces exterieurs a moindre cout et sans entretien. Mais face a la variete de calibres, couleurs et types de graviers disponibles, comment faire le bon choix ? Ce guide vous aide a <strong>choisir le gravier decoratif adapte a votre projet</strong>, avec les prix, quantites et conseils de pose.</p>

<h2 class="wp-block-heading">Les differents types de gravier decoratif</h2>

<p style="font-size:1rem;line-height:1.8">Il existe deux grandes familles de graviers decoratifs, chacune avec ses avantages :</p>

<h3 class="wp-block-heading">Gravillon concasse (anguleux)</h3>

<p style="font-size:1rem;line-height:1.8">Obtenu par broyage mecanique de la roche en carriere. Les aretes anguleuses permettent aux grains de <strong>s'imbriquer entre eux</strong>, ce qui stabilise la surface. C'est le meilleur choix pour :</p>

<ul class="wp-block-list">
<li><strong>Allees de jardin</strong> et chemins (bonne tenue sous les pas)</li>
<li><strong>Cours et parkings</strong> (se compacte bien)</li>
<li><strong>Pieds de murs</strong> et drains (facilite l'ecoulement)</li>
</ul>

<h3 class="wp-block-heading">Gravier roule (arrondi)</h3>

<p style="font-size:1rem;line-height:1.8">Use naturellement par l'eau (riviere, mer) ou poli mecaniquement. Les grains arrondis offrent un <strong>rendu plus doux et esthetique</strong> mais roulent sous les pieds. Ideal pour :</p>

<ul class="wp-block-list">
<li><strong>Massifs et plates-bandes</strong> (paillage mineral)</li>
<li><strong>Contours de piscine</strong> (agreable pieds nus)</li>
<li><strong>Jardins zen</strong> et decoratifs (rendu elegant)</li>
<li><strong>Pots et jardieres</strong> (finition decorative)</li>
</ul>

<h2 class="wp-block-heading">Quel calibre de gravier choisir ?</h2>

<p style="font-size:1rem;line-height:1.8">Le calibre (taille des grains) determine l'usage et le rendu visuel :</p>

<ul class="wp-block-list">
<li><strong>4/6 mm</strong> : tres fin, ideal pour les joints de dalles et le paillage de massifs. Rendu tres lisse.</li>
<li><strong>6/10 mm</strong> : le plus polyvalent. Convient aux allees de jardin, massifs et decoration. Agreable sous les pieds.</li>
<li><strong>10/14 mm</strong> : bonne tenue pour les allees carrossables legeres et les cours. Bon equilibre esthetique/fonctionnel.</li>
<li><strong>10/20 mm</strong> : robuste, ideal pour les allees carrossables et les parkings gravillonnes.</li>
<li><strong>20/40 mm</strong> : gros calibre pour drains, bordures, rocailles et remplissage de gabions.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Notre recommandation</strong> : pour une allee de jardin pietonne, le calibre <strong>6/10 ou 10/14 en gravillon calcaire concasse</strong> offre le meilleur compromis entre confort, tenue et esthetique.</p>

<h2 class="wp-block-heading">Quelles couleurs de gravier pour votre jardin ?</h2>

<p style="font-size:1rem;line-height:1.8">La couleur du gravier doit s'harmoniser avec votre maison, vos plantations et le style recherche :</p>

<ul class="wp-block-list">
<li><strong>Beige / creme</strong> (calcaire) : le plus courant dans le sud de la France. Tons chauds, s'integre avec les maisons en pierre. Lumineux sans etre eblouissant.</li>
<li><strong>Blanc</strong> (marbre, quartz) : rendu tres contemporain et lumineux. Attention : peut etre eblouissant en plein soleil et se salit plus vite.</li>
<li><strong>Gris</strong> (basalte, granit) : sobre et moderne. Ideal pour les jardins contemporains et les contours de piscine.</li>
<li><strong>Rose / saumon</strong> (marbre, gres) : doux et elegant. Populaire pour les massifs de plantes mediterraneennes.</li>
<li><strong>Noir</strong> (basalte) : spectaculaire en contraste avec des plantes vertes. Absorbe la chaleur — attention pres des zones de passage pieds nus.</li>
</ul>

<p style="font-size:1rem;line-height:1.8">En Aveyron et en Occitanie, le <strong>gravillon calcaire beige</strong> est le choix naturel : il s'harmonise avec l'architecture locale et coute moins cher que les graviers importes (marbre, basalte).</p>

<h2 class="wp-block-heading">Combien de gravier au m2 ? Calculer la bonne quantite</h2>

<p style="font-size:1rem;line-height:1.8">La quantite de gravier depend de l'epaisseur de la couche souhaitee :</p>

<ul class="wp-block-list">
<li><strong>Paillage decoratif</strong> (massifs, pieds de murs) : 3 a 5 cm d'epaisseur → <strong>50 a 80 kg/m2</strong></li>
<li><strong>Allee pietonne</strong> : 5 a 7 cm d'epaisseur → <strong>80 a 110 kg/m2</strong></li>
<li><strong>Allee carrossable</strong> : 7 a 10 cm d'epaisseur → <strong>110 a 160 kg/m2</strong></li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Exemple concret</strong> : pour une allee de jardin de 20 m2 avec 5 cm de gravillon calcaire, il vous faut environ <strong>1,6 a 2 tonnes</strong>. Prevoyez 10% de marge supplementaire.</p>

<h2 class="wp-block-heading">Prix du gravier decoratif</h2>

<p style="font-size:1rem;line-height:1.8">Le prix varie enormement selon le type de gravier et le mode d'achat :</p>

<ul class="wp-block-list">
<li><strong>Gravillon calcaire</strong> (achat en carriere, vrac) : <strong>25 a 50 EUR la tonne</strong> — le moins cher</li>
<li><strong>Gravier de marbre blanc</strong> : 100 a 200 EUR la tonne</li>
<li><strong>Galets de riviere</strong> : 80 a 150 EUR la tonne</li>
<li><strong>Basalte noir</strong> : 120 a 250 EUR la tonne</li>
<li><strong>En big bag</strong> (500 kg ou 1 500 kg) : +20 a 30% par rapport au vrac</li>
<li><strong>En sac de 25 kg</strong> (grande surface) : equivalent a 300-500 EUR la tonne — 5 a 10x plus cher</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Conseil</strong> : achetez toujours en <strong>vrac ou en big bag aupres d'une carriere</strong> plutot qu'en petits sacs en jardinerie. L'economie est considerable : pour 2 tonnes de gravillon calcaire, vous payez environ 80 EUR en carriere contre 600 EUR en sacs de 25 kg.</p>

<h2 class="wp-block-heading">Comment poser du gravier decoratif</h2>

<ol class="wp-block-list">
<li><strong>Decaisser</strong> la surface sur 5 a 10 cm selon l'usage</li>
<li><strong>Compacter le fond</strong> (ou poser une couche de tout-venant 0/31.5 pour les allees)</li>
<li><strong>Poser un feutre geotextile</strong> pour empecher la repousse des mauvaises herbes et eviter que le gravier ne s'enfonce dans la terre</li>
<li><strong>Installer des bordures</strong> (metal, bois, pierre) pour delimiter la zone et empecher le gravier de migrer</li>
<li><strong>Repandre le gravier</strong> uniformement au rateau, sur l'epaisseur prevue</li>
<li><strong>Ratisser</strong> pour egaliser la surface</li>
</ol>

<h2 class="wp-block-heading">Questions frequentes sur le gravier decoratif</h2>

<h3 class="wp-block-heading">Quel est le gravier le moins cher pour un jardin ?</h3>

<p style="font-size:1rem;line-height:1.8">Le <strong>gravillon calcaire concasse</strong>, achete en vrac directement en carriere, est le plus economique : 25 a 50 EUR la tonne. C'est 3 a 8 fois moins cher que les graviers de marbre ou de basalte. Et son rendu beige chaud est tres esthetique.</p>

<h3 class="wp-block-heading">Faut-il un geotextile sous le gravier ?</h3>

<p style="font-size:1rem;line-height:1.8">Oui, c'est fortement recommande. Le feutre geotextile empeche les mauvaises herbes de pousser a travers le gravier et evite que les graviers ne s'enfoncent dans la terre. Sans geotextile, vous devrez desherber regulierement et rajouter du gravier chaque annee.</p>

<h3 class="wp-block-heading">Gravier ou copeaux de bois pour les massifs ?</h3>

<p style="font-size:1rem;line-height:1.8">Le gravier mineral est <strong>plus durable</strong> : il ne se decompose pas, ne moisit pas et n'attire pas les insectes. Les copeaux de bois durent 2 a 3 ans avant de se degrader. Le gravier est un investissement unique qui dure des decennies.</p>

<h3 class="wp-block-heading">Combien coute la livraison de gravier ?</h3>

<p style="font-size:1rem;line-height:1.8">La livraison de gravier en vrac (camion benne) coute entre <strong>100 et 400 EUR</strong> selon la distance et le tonnage. Pour les petites quantites, le big bag (500 kg ou 1 500 kg) livre par camion-grue est une solution pratique, a partir de 80 EUR de livraison.</p>
