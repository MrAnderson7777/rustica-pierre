    <div class="article-body">
      <p style="font-size:1.0625rem;line-height:1.85">Habiller une façade ou un mur intérieur avec de la <strong>pierre de parement naturelle</strong> transforme instantanément l'aspect d'une maison. Authentique, durable et facile à poser, le parement en pierre naturelle est une alternative haut de gamme aux plaquettes en béton ou en plâtre. Dans ce guide, nous expliquons <strong>comment poser de la pierre de parement extérieur</strong>, quel type choisir et combien ça coûte.</p>

<h2 class="wp-block-heading">Qu'est-ce que la pierre de parement naturelle ?</h2>

<p style="font-size:1rem;line-height:1.8">La <strong>pierre de parement</strong> est un revêtement mural en pierre naturelle, d'épaisseur réduite (2 à 4 cm), destiné à habiller les surfaces sans supporter de charge. Contrairement à un mur en pierre massive, le parement est <strong>collé sur un support existant</strong> (parpaing, béton, brique, plaque de plâtre).</p>

<p style="font-size:1rem;line-height:1.8">Les plaquettes de parement en pierre naturelle se distinguent des imitations béton ou plâtre par leur <strong>authenticité</strong> : chaque pièce est unique, avec des variations de couleur et de texture propres à la pierre. Le résultat est incomparablement plus riche et naturel.</p>

<h2 class="wp-block-heading">Pierre de parement extérieur ou intérieur : quelle différence ?</h2>

<p style="font-size:1rem;line-height:1.8">La pierre naturelle convient aux deux usages, mais le choix du type de pierre et de la colle diffère :</p>

<ul class="wp-block-list">
<li><strong>Extérieur</strong> : privilégiez une pierre résistante au gel (calcaire dur, grès, quartzite). Utilisez un mortier-colle flexible classe C2S1 ou C2S2, adapté aux variations de température. Épaisseur recommandée : 3 à 4 cm.</li>
<li><strong>Intérieur</strong> : toutes les pierres conviennent (calcaire, ardoise, marbre). Un mortier-colle standard C1 ou C2 suffit. Épaisseur possible : 2 à 3 cm, ce qui réduit le poids au m2.</li>
</ul>

<p style="font-size:1rem;line-height:1.8">Pour une <strong>façade extérieure en Aveyron</strong>, la pierre calcaire locale est le choix idéal : elle résiste aux hivers rigoureux du plateau et ses tons chauds (beige, crème, doré) s'harmonisent parfaitement avec l'architecture aveyronnaise.</p>

<h2 class="wp-block-heading">Comment poser de la pierre de parement : les étapes</h2>

<h3 class="wp-block-heading">1. Préparer le support</h3>

<p style="font-size:1rem;line-height:1.8">Le support doit être <strong>propre, sec, plan et solide</strong>. Retirez tout enduit instable, peinture écaillée ou salissure. Sur un mur neuf en parpaing, attendez au minimum 28 jours de séchage. Sur un mur peint, poncez la surface pour créer de l'accroche.</p>

<p style="font-size:1rem;line-height:1.8">Appliquez un <strong>primaire d'accrochage</strong> si le support est lisse ou peu poreux (béton lisse, plaque de plâtre).</p>

<h3 class="wp-block-heading">2. Poser la colle</h3>

<p style="font-size:1rem;line-height:1.8">Utilisez la technique du <strong>double encollage</strong> : appliquez le mortier-colle au mur avec une spatule crantée (dents de 10 mm), puis beurrez également le dos de chaque plaquette. Cette méthode garantit une adhérence maximale, indispensable pour l'extérieur.</p>

<h3 class="wp-block-heading">3. Poser les plaquettes</h3>

<p style="font-size:1rem;line-height:1.8">Commencez par le <strong>bas du mur</strong>, en posant la première rangée bien horizontale (utilisez un niveau). Progressez vers le haut, rangée par rangée. Décalez les joints d'une rangée à l'autre (comme un appareillage de briques).</p>

<p style="font-size:1rem;line-height:1.8">Pour les coupes, utilisez une meuleuse d'angle avec un disque diamanté. Portez lunettes et masque : la poussière de pierre calcaire est fine.</p>

<h3 class="wp-block-heading">4. Réaliser les joints</h3>

<p style="font-size:1rem;line-height:1.8">Les joints entre plaquettes (10 à 15 mm) se remplissent avec un <strong>mortier de jointoiement adapté à la pierre</strong>. Utilisez une poche à douille ou un pistolet à joints. Lissez au fer à joint avant séchage complet. Nettoyez les débordements à l'éponge humide.</p>

<p style="font-size:1rem;line-height:1.8">Certains clients préfèrent la pose <strong>à joints vifs</strong> (sans joints visibles), où les plaquettes sont ajustées bord à bord. Le rendu est plus moderne mais demande des plaquettes bien calibrées.</p>

<h2 class="wp-block-heading">Prix du parement en pierre naturelle</h2>

<p style="font-size:1rem;line-height:1.8">Le prix des plaquettes de parement en pierre naturelle varie selon le type de pierre et la provenance :</p>

<ul class="wp-block-list">
<li><strong>Pierre calcaire</strong> (locale, carrière) : 40 à 80 EUR / m2</li>
<li><strong>Grès</strong> : 50 à 100 EUR / m2</li>
<li><strong>Ardoise</strong> : 45 à 90 EUR / m2</li>
<li><strong>Quartzite</strong> : 60 à 120 EUR / m2</li>
</ul>

<p style="font-size:1rem;line-height:1.8">À ces prix de fourniture, ajoutez la <strong>pose par un professionnel</strong> : 35 à 60 EUR / m2. Budget total : <strong>75 à 180 EUR / m2</strong> fourniture et pose comprises.</p>

<p style="font-size:1rem;line-height:1.8">En comparaison, le parement en béton reconstitué coûte 20 à 50 EUR / m2 mais s'use plus vite, grise avec le temps et n'a pas l'authenticité de la pierre naturelle.</p>

<h2 class="wp-block-heading">Les avantages de la pierre de parement naturelle</h2>

<ul class="wp-block-list">
<li><strong>Esthétique inégalable</strong> : chaque plaquette est unique, avec des nuances naturelles</li>
<li><strong>Durabilité</strong> : la pierre naturelle ne se décolore pas et résiste aux intempéries</li>
<li><strong>Isolation thermique</strong> : la masse de la pierre contribue à l'inertie thermique du mur</li>
<li><strong>Valorisation immobilière</strong> : un parement en pierre naturelle augmente la valeur perçue d'un bien</li>
<li><strong>Entretien minimal</strong> : un nettoyage au jet d'eau annuel suffit pour l'extérieur</li>
<li><strong>Écologique</strong> : matériau naturel, durable, sans composants chimiques</li>
</ul>

<h2 class="wp-block-heading">Questions fréquentes sur le parement en pierre</h2>

<h3 class="wp-block-heading">Quelle épaisseur pour un parement extérieur en pierre naturelle ?</h3>

<p style="font-size:1rem;line-height:1.8">Pour l'extérieur, privilégiez une épaisseur de <strong>3 à 4 cm</strong>. Cette épaisseur garantit une bonne résistance aux chocs et aux intempéries. Pour l'intérieur, 2 cm suffisent et réduisent le poids au m2 (environ 40 à 50 kg/m2 contre 70 à 80 kg/m2 en 4 cm).</p>

<h3 class="wp-block-heading">Peut-on poser du parement en pierre sur du placo ?</h3>

<p style="font-size:1rem;line-height:1.8">Oui, à condition d'utiliser des plaquettes <strong>légères (épaisseur 2 cm max)</strong> et de vérifier que la cloison en placo est suffisamment solide (BA13 fixé sur ossature métallique). Au-delà de 30 kg/m2, renforcez la fixation avec des pattes métalliques. Utilisez un primaire d'accrochage systématiquement.</p>

<h3 class="wp-block-heading">Combien de m2 de parement peut-on poser en une journée ?</h3>

<p style="font-size:1rem;line-height:1.8">Un professionnel pose environ <strong>6 à 10 m2 par jour</strong> en parement pierre naturelle (incluant préparation, encollage, pose et joints). Un bon bricoleur peut atteindre 3 à 5 m2 par jour. Prévoyez 2 journées pour un mur de cheminée de 8 m2.</p>

<h3 class="wp-block-heading">Pierre naturelle ou béton reconstitué pour un parement ?</h3>

<p style="font-size:1rem;line-height:1.8">La pierre naturelle coûte plus cher à l'achat (×2) mais offre une <strong>durée de vie 3 à 5 fois supérieure</strong>. Le béton reconstitué grise et se dégrade en 10-15 ans, surtout en extérieur. Sur 30 ans, la pierre naturelle revient moins cher et embellit en patinant.</p>
