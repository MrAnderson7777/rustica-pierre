    <div class="article-body">
      <p style="font-size:1.0625rem;line-height:1.85">Vous hésitez entre une terrasse en <strong>dalle de pierre naturelle</strong> et une terrasse en <strong>béton</strong> ? C'est l'un des dilemmes les plus courants pour un aménagement extérieur. Le béton séduit par son prix initial, la pierre naturelle par sa durabilité et son esthétique. Dans ce comparatif, nous analysons les deux options sur 8 critères concrets pour vous aider à faire le bon choix.</p>

<h2 class="wp-block-heading">Pierre naturelle vs béton : comparatif détaillé</h2>

<h3 class="wp-block-heading">1. Prix d'achat</h3>

<ul class="wp-block-list">
<li><strong>Béton</strong> (dalles ou coulé) : 20 à 60 EUR / m2 fourniture</li>
<li><strong>Pierre naturelle calcaire</strong> : 30 à 80 EUR / m2 fourniture</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : le béton est 30 à 50 % moins cher à l'achat. Mais ce n'est que le coût initial — la suite change la donne.</p>

<h3 class="wp-block-heading">2. Durée de vie</h3>

<ul class="wp-block-list">
<li><strong>Béton</strong> : 15 à 25 ans avant fissuration, grisaillement et dégradation visible</li>
<li><strong>Pierre naturelle</strong> : 50 à 100 ans, parfois plus. Les terrasses en pierre de certaines bastides aveyronnaises ont 200 ans.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : la pierre dure 3 à 5 fois plus longtemps. Sur 50 ans, vous refaites une terrasse béton au moins 2 fois.</p>

<h3 class="wp-block-heading">3. Coût sur 30 ans</h3>

<p style="font-size:1rem;line-height:1.8">Prenons une terrasse de 30 m2 :</p>

<ul class="wp-block-list">
<li><strong>Béton</strong> : 1 200 EUR (pose initiale) + 1 200 EUR (réfection à 20 ans) + entretien = <strong>~3 000 EUR sur 30 ans</strong></li>
<li><strong>Pierre naturelle</strong> : 2 400 EUR (pose initiale) + 0 EUR (pas de réfection) + entretien minimal = <strong>~2 600 EUR sur 30 ans</strong></li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : la pierre naturelle revient <strong>moins cher sur le long terme</strong>, malgré un investissement initial plus élevé.</p>

<h3 class="wp-block-heading">4. Esthétique</h3>

<ul class="wp-block-list">
<li><strong>Béton</strong> : uniforme, gris, aspect industriel. Les dalles béton imitent parfois la pierre mais le résultat reste artificiel de près.</li>
<li><strong>Pierre naturelle</strong> : chaque dalle est unique, avec des variations de teinte et de texture. Patine naturelle qui embellit avec le temps.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : avantage net pour la pierre. C'est souvent la raison principale du choix.</p>

<h3 class="wp-block-heading">5. Entretien</h3>

<ul class="wp-block-list">
<li><strong>Béton</strong> : se fissure avec le gel, verdit avec les algues, grise avec le temps. Nettoyage haute pression nécessaire 1 à 2 fois par an.</li>
<li><strong>Pierre naturelle</strong> : un lavage au savon noir et à l'eau suffit. La mousse éventuelle se brosse facilement. Pas de fissuration.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : entretien équivalent en fréquence, mais la pierre ne se dégrade pas avec le temps.</p>

<h3 class="wp-block-heading">6. Résistance au gel</h3>

<ul class="wp-block-list">
<li><strong>Béton</strong> : sensible aux cycles gel-dégel. Les dalles éclatent et se fissurent après quelques hivers rigoureux.</li>
<li><strong>Pierre calcaire dure</strong> : supporte les cycles gel-dégel sans dommage (si absorption &lt; 5 %). Les murs en pierre du Causse traversent les siècles.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : la pierre calcaire dure est nettement plus résistante au gel que le béton standard.</p>

<h3 class="wp-block-heading">7. Impact écologique</h3>

<ul class="wp-block-list">
<li><strong>Béton</strong> : la fabrication du ciment émet environ 600 kg de CO2 par tonne. Le béton n'est pas facilement recyclable.</li>
<li><strong>Pierre naturelle</strong> : extraction mécanique simple, pas de transformation chimique, réutilisable à l'infini. Empreinte carbone 5 à 10 fois inférieure.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : avantage massif pour la pierre naturelle. C'est l'un des matériaux de construction les plus écologiques.</p>

<h3 class="wp-block-heading">8. Valeur immobilière</h3>

<ul class="wp-block-list">
<li><strong>Béton</strong> : aucun impact positif sur la valeur du bien, voire négatif si la terrasse est dégradée.</li>
<li><strong>Pierre naturelle</strong> : une terrasse en pierre est un argument de vente. Valorisation estimée de 5 à 10 % sur la valeur perçue du bien.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : la pierre naturelle est un investissement patrimonial.</p>

<h2 class="wp-block-heading">Quand choisir le béton malgré tout ?</h2>

<p style="font-size:1rem;line-height:1.8">Le béton reste pertinent dans certains cas :</p>

<ul class="wp-block-list">
<li><strong>Budget très serré</strong> : si vous ne pouvez absolument pas dépasser 30 EUR/m2 en fourniture</li>
<li><strong>Usage temporaire</strong> : terrasse d'un logement locatif ou aménagement provisoire</li>
<li><strong>Béton décoré</strong> (désactivé, imprimé) : ces techniques offrent un rendu correct à prix intermédiaire (60-100 EUR/m2)</li>
<li><strong>Formes complexes</strong> : le béton coulé épouse toutes les formes, contrairement aux dalles rigides</li>
</ul>

<h2 class="wp-block-heading">Questions fréquentes</h2>

<h3 class="wp-block-heading">Les dalles béton imitation pierre sont-elles une bonne alternative ?</h3>

<p style="font-size:1rem;line-height:1.8">Les dalles béton "effet pierre" coûtent 15 à 30 EUR/m2, soit moins que la vraie pierre. Mais le rendu est visible de près (motifs répétitifs, couleur uniforme) et elles vieillissent mal (décoloration, mousse). Sur 20 ans, la vraie pierre est plus économique et infiniment plus belle.</p>

<h3 class="wp-block-heading">Peut-on poser de la pierre naturelle sur une dalle béton existante ?</h3>

<p style="font-size:1rem;line-height:1.8">Oui, c'est même la méthode la plus stable. Si votre dalle béton est en bon état (pas de fissures majeures), vous pouvez <strong>coller des dalles en pierre naturelle</strong> directement dessus avec un mortier-colle C2S1. Épaisseur supplémentaire : 2 à 4 cm seulement. C'est une excellente façon de rénover une terrasse béton fatiguée.</p>

<h3 class="wp-block-heading">Quel est le matériau le plus écologique pour une terrasse ?</h3>

<p style="font-size:1rem;line-height:1.8">La <strong>pierre naturelle locale</strong> est le matériau le plus écologique : extraction mécanique simple, pas de transformation chimique, durée de vie centenaire, réutilisable. Son empreinte carbone est 5 à 10 fois inférieure à celle du béton. Le bois est également écologique mais nécessite un entretien régulier et dure moins longtemps.</p>
