    <div class="article-body">
      <p style="font-size:1.0625rem;line-height:1.85">Vous hesitez entre une terrasse en <strong>dalle de pierre naturelle</strong> et une terrasse en <strong>beton</strong> ? C'est l'un des dilemmes les plus courants pour un amenagement exterieur. Le beton seduit par son prix initial, la pierre naturelle par sa durabilite et son esthetique. Dans ce comparatif, nous analysons les deux options sur 8 criteres concrets pour vous aider a faire le bon choix.</p>

<h2 class="wp-block-heading">Pierre naturelle vs beton : comparatif detaille</h2>

<h3 class="wp-block-heading">1. Prix d'achat</h3>

<ul class="wp-block-list">
<li><strong>Beton</strong> (dalles ou coule) : 20 a 60 EUR / m2 fourniture</li>
<li><strong>Pierre naturelle calcaire</strong> : 30 a 80 EUR / m2 fourniture</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : le beton est 30 a 50% moins cher a l'achat. Mais ce n'est que le cout initial — la suite change la donne.</p>

<h3 class="wp-block-heading">2. Duree de vie</h3>

<ul class="wp-block-list">
<li><strong>Beton</strong> : 15 a 25 ans avant fissuration, grisaillement et degradation visible</li>
<li><strong>Pierre naturelle</strong> : 50 a 100 ans, parfois plus. Les terrasses en pierre de certaines bastides aveyronnaises ont 200 ans.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : la pierre dure 3 a 5 fois plus longtemps. Sur 50 ans, vous refaites une terrasse beton au moins 2 fois.</p>

<h3 class="wp-block-heading">3. Cout sur 30 ans</h3>

<p style="font-size:1rem;line-height:1.8">Prenons une terrasse de 30 m2 :</p>

<ul class="wp-block-list">
<li><strong>Beton</strong> : 1 200 EUR (pose initiale) + 1 200 EUR (refection a 20 ans) + entretien = <strong>~3 000 EUR sur 30 ans</strong></li>
<li><strong>Pierre naturelle</strong> : 2 400 EUR (pose initiale) + 0 EUR (pas de refection) + entretien minimal = <strong>~2 600 EUR sur 30 ans</strong></li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : la pierre naturelle revient <strong>moins cher sur le long terme</strong>, malgre un investissement initial plus eleve.</p>

<h3 class="wp-block-heading">4. Esthetique</h3>

<ul class="wp-block-list">
<li><strong>Beton</strong> : uniforme, gris, aspect industriel. Les dalles beton imitent parfois la pierre mais le resultat reste artificiel de pres.</li>
<li><strong>Pierre naturelle</strong> : chaque dalle est unique, avec des variations de teinte et de texture. Patine naturelle qui embellit avec le temps.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : avantage net pour la pierre. C'est souvent la raison principale du choix.</p>

<h3 class="wp-block-heading">5. Entretien</h3>

<ul class="wp-block-list">
<li><strong>Beton</strong> : se fissure avec le gel, verdit avec les algues, grise avec le temps. Nettoyage haute pression necessaire 1 a 2 fois par an.</li>
<li><strong>Pierre naturelle</strong> : un lavage au savon noir et a l'eau suffit. La mousse eventuelle se brosse facilement. Pas de fissuration.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : entretien equivalent en frequence, mais la pierre ne se degrade pas avec le temps.</p>

<h3 class="wp-block-heading">6. Resistance au gel</h3>

<ul class="wp-block-list">
<li><strong>Beton</strong> : sensible aux cycles gel-degel. Les dalles eclatent et se fissurent apres quelques hivers rigoureux.</li>
<li><strong>Pierre calcaire dure</strong> : supporte les cycles gel-degel sans dommage (si absorption < 5%). Les murs en pierre du Causse traversent les siecles.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : la pierre calcaire dure est nettement plus resistante au gel que le beton standard.</p>

<h3 class="wp-block-heading">7. Impact ecologique</h3>

<ul class="wp-block-list">
<li><strong>Beton</strong> : la fabrication du ciment emet environ 600 kg de CO2 par tonne. Le beton n'est pas facilement recyclable.</li>
<li><strong>Pierre naturelle</strong> : extraction mecanique simple, pas de transformation chimique, reutilisable a l'infini. Empreinte carbone 5 a 10 fois inferieure.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : avantage massif pour la pierre naturelle. C'est l'un des materiaux de construction les plus ecologiques.</p>

<h3 class="wp-block-heading">8. Valeur immobiliere</h3>

<ul class="wp-block-list">
<li><strong>Beton</strong> : aucun impact positif sur la valeur du bien, voire negatif si la terrasse est degradee.</li>
<li><strong>Pierre naturelle</strong> : une terrasse en pierre est un argument de vente. Valorisation estimee de 5 a 10% sur la valeur percue du bien.</li>
</ul>

<p style="font-size:1rem;line-height:1.8"><strong>Verdict</strong> : la pierre naturelle est un investissement patrimonial.</p>

<h2 class="wp-block-heading">Quand choisir le beton malgre tout ?</h2>

<p style="font-size:1rem;line-height:1.8">Le beton reste pertinent dans certains cas :</p>

<ul class="wp-block-list">
<li><strong>Budget tres serre</strong> : si vous ne pouvez absolument pas depasser 30 EUR/m2 en fourniture</li>
<li><strong>Usage temporaire</strong> : terrasse d'un logement locatif ou amenagement provisoire</li>
<li><strong>Beton decore</strong> (desactive, imprime) : ces techniques offrent un rendu correct a prix intermediaire (60-100 EUR/m2)</li>
<li><strong>Formes complexes</strong> : le beton coule epouse toutes les formes, contrairement aux dalles rigides</li>
</ul>

<h2 class="wp-block-heading">Questions frequentes</h2>

<h3 class="wp-block-heading">Les dalles beton imitation pierre sont-elles une bonne alternative ?</h3>

<p style="font-size:1rem;line-height:1.8">Les dalles beton "effet pierre" coutent 15 a 30 EUR/m2, soit moins que la vraie pierre. Mais le rendu est visible de pres (motifs repetitifs, couleur uniforme) et elles vieillissent mal (decoloration, mousse). Sur 20 ans, la vraie pierre est plus economique et infiniment plus belle.</p>

<h3 class="wp-block-heading">Peut-on poser de la pierre naturelle sur une dalle beton existante ?</h3>

<p style="font-size:1rem;line-height:1.8">Oui, c'est meme la methode la plus stable. Si votre dalle beton est en bon etat (pas de fissures majeures), vous pouvez <strong>coller des dalles en pierre naturelle</strong> directement dessus avec un mortier-colle C2S1. Epaisseur supplementaire : 2 a 4 cm seulement. C'est une excellente facon de renover une terrasse beton fatiguee.</p>

<h3 class="wp-block-heading">Quel est le materiau le plus ecologique pour une terrasse ?</h3>

<p style="font-size:1rem;line-height:1.8">La <strong>pierre naturelle locale</strong> est le materiau le plus ecologique : extraction mecanique simple, pas de transformation chimique, duree de vie centenaire, reutilisable. Son empreinte carbone est 5 a 10 fois inferieure a celle du beton. Le bois est egalement ecologique mais necessite un entretien regulier et dure moins longtemps.</p>
